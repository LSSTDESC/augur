[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "augur"
dynamic = ["version"]

authors = [
    {name = "DESC Team"},
]
description = "DESC Cosmology Forecasting Tool"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "click",
    "jinja2",
    "healpy",
    "numpydoc",
    "qp-prob",
    "scipy>1.12",
    "numdifftools",
    "tjpcov>=0.5.1",
    "pyccl>=3.3.1",
    "numpy>=2.0",
    "astropy",
    "matplotlib",
    "pandas",
    "lsstdesc-crow",
    "sacc>=2.4",
    "derivkit",
    "threadpoolctl",
    "pyyaml"
]
# firecrown>=1.16.0 is also required but is distributed through conda-forge
# only; see environment.yml.

[project.urls]
Homepage = "https://github.com/LSSTDESC/augur"

[project.scripts]
augur = "augur.cli:run"

[tool.setuptools.packages.find]
exclude = ["examples*", "tests*"]

[tool.setuptools.package-data]
augur = ["*"]

[tool.setuptools.dynamic]
version = {attr = "augur._version.__version__"}
